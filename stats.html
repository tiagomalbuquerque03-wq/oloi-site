<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oloi — uso</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f0e4;
    --card: #ffffff;
    --line: #e6dac4;
    --text: #181410;
    --dim: #7c7161;
    --accent: #e07a5f;
    --ok: #4f9e6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16130f; --card: #201b15; --line: #322a20;
      --text: #f1ead9; --dim: #a2967f; --accent: #e88a70; --ok: #79b98c;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 44rem; margin: 0 auto; padding: clamp(2rem, 6vw, 4rem) clamp(1.1rem, 5vw, 2rem) 4rem; }
  .brand {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600; font-size: 1.1rem; color: var(--text); text-decoration: none;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600; font-size: clamp(1.7rem, 5vw, 2.2rem);
    margin: 1.8rem 0 0.3rem;
  }
  .sub { color: var(--dim); font-size: 0.95rem; margin-bottom: 2.2rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .tile { background: var(--card); padding: 1.4rem 1.2rem 1.2rem; }
  .tile .n {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 2.7rem;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .tile .k {
    margin-top: 0.5rem;
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 600;
  }
  .tile.hero .n { color: var(--accent); }
  .foot {
    margin-top: 1.6rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .err { color: var(--accent); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/">Oloi</a>
    <h1>Quem está usando</h1>
    <p class="sub">Contas e atividade em tempo quase real. Só números — nenhum dado de pessoa.</p>

    <div class="grid" id="grid">
      <div class="tile hero"><div class="n" data-k="total">·</div><div class="k">Contas no total</div></div>
      <div class="tile"><div class="n" data-k="active_24h">·</div><div class="k">Abriram · 24h</div></div>
      <div class="tile"><div class="n" data-k="active_7d">·</div><div class="k">Abriram · 7 dias</div></div>
      <div class="tile"><div class="n" data-k="new_24h">·</div><div class="k">Novos · 24h</div></div>
      <div class="tile"><div class="n" data-k="new_7d">·</div><div class="k">Novos · 7 dias</div></div>
    </div>

    <div class="foot" id="foot"><span class="pulse"></span><span id="foot-txt">carregando…</span></div>
  </div>

<script>
  var URL_BASE = "https://xmopqbowwkrpmpaeybua.supabase.co/rest/v1/rpc/get_launch_stats";
  var ANON = "sb_publishable_Hv8jI08Xjbvgoy9JLUdAJA_aTlLqfg6";

  function setFoot(txt, isErr) {
    var el = document.getElementById("foot-txt");
    el.textContent = txt;
    el.className = isErr ? "err" : "";
  }

  async function load() {
    try {
      var res = await fetch(URL_BASE, {
        method: "POST",
        headers: { "apikey": ANON, "Authorization": "Bearer " + ANON, "Content-Type": "application/json" },
        body: "{}"
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var d = await res.json();
      ["total", "active_24h", "active_7d", "new_24h", "new_7d"].forEach(function (k) {
        var el = document.querySelector('[data-k="' + k + '"]');
        if (el) el.textContent = (d[k] == null ? "–" : d[k].toLocaleString("pt-BR"));
      });
      var t = new Date();
      setFoot("atualizado " + t.toLocaleTimeString("pt-BR"), false);
    } catch (e) {
      setFoot("erro ao carregar (" + e.message + ") — a migração já foi aplicada no Supabase?", true);
    }
  }

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
